<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bias broadcasting across examples</title>
<style>
:root { color-scheme: light dark; --bg:#fff; --ink:#203247; --muted:#526477; --line:#d8e0e8; --accent:#176e9d; --tint:#eaf5fc; }
* { box-sizing:border-box; }
html,body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 system-ui,sans-serif; }
main { padding:20px; max-width:760px; margin:auto; }
h1 { font-size:1.2rem; margin:0 0 6px; }
p { margin:0 0 16px; }
.muted { color:var(--muted); font-size:.9rem; }
.controls { display:flex; flex-wrap:wrap; align-items:end; gap:18px; margin:20px 0; }
label { display:block; font-weight:600; }
select { margin-top:6px; padding:7px 10px; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:6px; font:inherit; }
.slider { flex:1 1 190px; }
input[type=range] { display:block; margin:10px 0 0; width:100%; accent-color:var(--accent); }
output { color:var(--accent); font-variant-numeric:tabular-nums; }
.matrices { display:flex; align-items:center; justify-content:center; gap:25px; margin:20px 0; }
.matrix { display:grid; border-left:2px solid var(--ink); border-right:2px solid var(--ink); padding:5px; border-radius:5px; gap:5px; }
.bias { grid-template-columns:1fr; }
.batch { grid-template-columns:repeat(2,minmax(58px,1fr)); }
.cell { padding:9px 13px; text-align:center; min-width:58px; font:1.15rem/1.4 Georgia,serif; font-variant-numeric:tabular-nums; border-radius:4px; }
.active { color:var(--accent); background:var(--tint); font-weight:700; }
.caption { text-align:center; font-weight:600; margin-bottom:8px; }
.arrow { font-size:1.6rem; color:var(--muted); }
.row-labels { display:grid; gap:5px; padding-top:5px; color:var(--muted); font-size:.8rem; }
.row-labels span { min-height:44px; display:flex; align-items:center; }
.batch-group { display:flex; gap:10px; }
.result { border-top:1px solid var(--line); padding-top:15px; margin-bottom:0; }
@media(max-width:430px) { main { padding:16px; } .matrices { gap:12px; } .cell { min-width:44px; padding:9px 7px; } .batch { grid-template-columns:repeat(2,minmax(44px,1fr)); } .row-labels { font-size:.75rem; } .arrow { font-size:1.2rem; } }
@media(prefers-color-scheme:dark) { :root { --bg:#18212b; --ink:#e5edf5; --muted:#b1becb; --line:#425368; --accent:#8ed4fc; --tint:#223e52; } }
</style>
</head>
<body>
<main>
<h1>One bias coordinate, every example</h1>
<p class="muted">Rows are examples. Columns are output coordinates. Only the selected bias changes.</p>
<div class="controls">
  <div><label for="coordinate">Bias coordinate</label><select id="coordinate"><option value="0">b₁ · output column 1</option><option value="1" selected>b₂ · output column 2</option></select></div>
  <div class="slider"><label for="shift">Change h = <output id="amount" for="shift">0.10</output></label><input id="shift" type="range" min="-1" max="1" step="0.05" value="0.1" aria-label="Bias change h"></div>
</div>
<div class="matrices">
  <div><div class="caption">Δb</div><div class="matrix bias" id="bias" role="img" aria-label="Bias-change column"></div></div>
  <div class="arrow" aria-hidden="true">→</div>
  <div><div class="caption">ΔZ · 3 × 2</div><div class="batch-group"><div class="row-labels" aria-hidden="true"><span>Example 1</span><span>Example 2</span><span>Example 3</span></div><div class="matrix batch" id="batch" role="img" aria-label="Output-change matrix"></div></div></div>
</div>
<p class="result" id="result" aria-live="polite"></p>
</main>
<script>
(() => {
  const coordinate = document.getElementById('coordinate');
  const shift = document.getElementById('shift');
  const bias = document.getElementById('bias');
  const batch = document.getElementById('batch');
  const amount = document.getElementById('amount');
  const result = document.getElementById('result');
  const format = value => value === 0 ? '0' : value.toFixed(2);
  const cell = (value, active) => {
    const element = document.createElement('span');
    element.className = 'cell' + (active ? ' active' : '');
    element.textContent = format(value);
    return element;
  };
  const render = () => {
    const selected = Number(coordinate.value);
    const h = Number(shift.value);
    const values = [0, 0];
    values[selected] = h;
    amount.value = h.toFixed(2);
    bias.replaceChildren(...values.map((value, i) => cell(value, i === selected)));
    batch.replaceChildren(...Array.from({length: 6}, (_, index) => cell(values[index % 2], index % 2 === selected)));
    bias.setAttribute('aria-label', `Bias change: ${values.map(format).join(', ')}`);
    batch.setAttribute('aria-label', `Three rows, each containing ${values.map(format).join(', ')}`);
    result.textContent = `Changing b${selected + 1} by ${h.toFixed(2)} gives that same change in output column ${selected + 1} for all three examples. The other column has zero change.`;
  };
  coordinate.addEventListener('change', render);
  shift.addEventListener('input', render);
  render();
})();
</script>
</body>
</html>
